[package]
name = "clack-private-fs"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Narrow Windows private-file creation adapter for clack"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"

