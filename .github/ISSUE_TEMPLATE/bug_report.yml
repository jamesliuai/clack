name: Bug report
description: Report a reproducible problem in clack
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping make clack more reliable.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A concise description of the behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the command, configuration, and smallest reliable sequence of steps.
      placeholder: |
        1. Run `clack ...`
        2. Press ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include `clack --version`, operating system, terminal, shell, and terminal size.
      render: text
      placeholder: |
        clack 0.1.0
        macOS 15.6
        Ghostty 1.x / zsh
        120 columns x 40 rows
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration or output
      description: Remove private paths or custom text before pasting configuration, logs, or screenshots.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I can reproduce this with the newest clack release.
          required: true

