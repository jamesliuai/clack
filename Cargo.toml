[package]
name = "clack-typing"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "A local-first, keyboard-driven terminal typing test"
license = "MIT"
readme = "README.md"
publish = ["crates-io"]
repository = "https://github.com/jamesliuai/clack"
keywords = ["typing", "terminal", "tui", "cli", "keyboard"]
categories = ["command-line-utilities", "games"]
exclude = [".github/", "vendor/", "dist/"]
default-run = "clack"

[workspace]
members = ["vendor/clack-private-fs"]
default-members = [".", "vendor/clack-private-fs"]
exclude = ["vendor/crossterm", "vendor/ratatui-crossterm"]
resolver = "3"

[lib]
name = "clack"

[[bin]]
name = "clack"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.2"
crossterm = { package = "clack-crossterm", version = "=0.30.0", path = "vendor/crossterm", features = ["associated-text", "poll-waker", "managed-signals", "use-dev-tty"] }
directories = "6"
ratatui = { version = "0.30.2", default-features = false }
ratatui-crossterm = { package = "clack-ratatui-crossterm", version = "=0.2.0", path = "vendor/ratatui-crossterm" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
toml_edit = "0.23"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
csv = "1.4"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
nix = { version = "0.30", features = ["signal", "term", "fs", "process"] }

[target.'cfg(windows)'.dependencies]
clack-private-fs = { version = "=1.0.0", path = "vendor/clack-private-fs" }

[dev-dependencies]
proptest = "1.11"
tempfile = "3"
allocation-counter = "0.8"

[features]
default = []
test-hooks = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
